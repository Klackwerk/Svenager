name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Build agent binaries and .deb packages
        uses: goreleaser/goreleaser-action@v6
        with:
          workdir: agent
          args: release --clean
      - name: Extract current changelog section
        run: awk '/^## /{n++} n==1' CHANGELOG.md > release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes || true
          gh release create "$GITHUB_REF_NAME" \
            --title "Svenager ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            agent/dist/*.deb agent/dist/*.tar.gz agent/dist/checksums.txt
