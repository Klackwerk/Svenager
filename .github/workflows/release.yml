name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Baut die Produktions-Images aus dem Release-Tag und pusht sie nach
  # Harbor. HARBOR_USERNAME/HARBOR_PASSWORD sind Repo-Secrets (Robot mit
  # Push-Rechten auf das kulturkosmos-Projekt).
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.klackwerk.de
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Version aus dem Tag ableiten
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Server-Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          push: true
          tags: registry.klackwerk.de/kulturkosmos/svenager/server:${{ env.VERSION }}
      - name: Frontend-Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: registry.klackwerk.de/kulturkosmos/svenager/frontend:${{ env.VERSION }}

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Build agent binaries and .deb packages
        uses: goreleaser/goreleaser-action@v6
        with:
          workdir: agent
          args: release --clean
      - name: Extract current changelog section
        run: awk '/^## /{n++} n==1' CHANGELOG.md > release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes || true
          gh release create "$GITHUB_REF_NAME" \
            --title "Svenager ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            agent/dist/*.deb agent/dist/*.tar.gz agent/dist/checksums.txt
