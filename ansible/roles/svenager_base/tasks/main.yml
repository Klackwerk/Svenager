---
- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ svenager_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# svenager_hostname is injected by the server: the device name maintained in
# the Svenager UI. The device converges on it with the next apply.
- name: Set device hostname
  ansible.builtin.hostname:
    name: "{{ svenager_hostname }}"
  when: svenager_hostname | default('') | length > 0

- name: Map the hostname in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1\t{{ svenager_hostname }}"
  when: svenager_hostname | default('') | length > 0
