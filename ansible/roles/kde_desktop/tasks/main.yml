---
- name: Install KDE Plasma desktop
  ansible.builtin.apt:
    name:
      - kde-plasma-desktop
      - sddm
      - plasma-nm
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install Microsoft core fonts
  ansible.builtin.apt:
    name: ttf-mscorefonts-installer
    state: present
  when: kde_desktop_ms_fonts

- name: Add OnlyOffice signing key
  ansible.builtin.get_url:
    url: https://download.onlyoffice.com/GPG-KEY-ONLYOFFICE
    dest: /usr/share/keyrings/onlyoffice.asc
    mode: "0644"

- name: Add OnlyOffice repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/onlyoffice.asc]
      https://download.onlyoffice.com/repo/debian squeeze main
    filename: onlyoffice
    state: present

- name: Install OnlyOffice Desktop Editors
  ansible.builtin.apt:
    name: onlyoffice-desktopeditors
    state: present
    update_cache: true

- name: Make OnlyOffice the default office application
  ansible.builtin.template:
    src: mimeapps.list.j2
    dest: /etc/xdg/mimeapps.list
    owner: root
    group: root
    mode: "0644"

# Windows-familiar behavior for every user: double-click opens files.
- name: Apply Windows-familiar KDE defaults
  ansible.builtin.copy:
    dest: /etc/xdg/kdeglobals
    content: |
      [KDE]
      SingleClick=false
    owner: root
    group: root
    mode: "0644"

- name: Boot into the graphical target
  ansible.builtin.file:
    src: /lib/systemd/system/graphical.target
    dest: /etc/systemd/system/default.target
    state: link
    force: true
  when: ansible_service_mgr == 'systemd'

- name: Enable the login manager
  ansible.builtin.systemd:
    name: sddm
    enabled: true
    daemon_reload: true
  when: ansible_service_mgr == 'systemd'
