---
argument_specs:
  main:
    short_description: Remote view VNC server
    description:
      - Installs a VNC server bound to 127.0.0.1 so Svenager operators can
        view the device's screen through the audited reverse tunnel. Pick
        the backend matching the device's display stack.
    options:
      vnc_server_backend:
        type: str
        default: wayvnc
        choices: [wayvnc, x11vnc]
        description:
          - wayvnc for Wayland/wlroots desktops (Raspberry Pi OS default),
            x11vnc for classic X11 sessions.
      vnc_server_port:
        type: int
        default: 5900
        description: Port the VNC server listens on (localhost only).
