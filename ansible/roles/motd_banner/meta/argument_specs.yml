---
argument_specs:
  main:
    short_description: Enrollment banner
    description:
      - Writes a large banner to /etc/motd telling anyone on the device
        console that the device is enrolled in Svenager, including the
        instance URL it reports to.
    options:
      motd_banner_url:
        type: str
        description:
          - The Svenager instance URL shown in the banner. Defaults to the
            server URL the agent reports to (svenager_server_url).
      motd_banner_extra:
        type: str
        default: ""
        description: Optional extra line under the banner.
