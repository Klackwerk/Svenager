---
argument_specs:
  main:
    short_description: KDE Desktop
    description:
      - Installs the KDE Plasma desktop (Debian 13) with Windows-familiar
        defaults and OnlyOffice as the default office suite for Word,
        Excel, PowerPoint and OpenDocument files.
    options:
      kde_desktop_ms_fonts:
        type: bool
        default: false
        description:
          - Install the Microsoft core fonts (requires the contrib apt
            section) for better document fidelity.
