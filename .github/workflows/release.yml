name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  # Builds the production images from the release tag and pushes them to
  # ghcr.io using the built-in GITHUB_TOKEN. The source label links the
  # packages to this repo; make them public once in the package settings.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/klackwerk/svenager/server:${{ env.VERSION }}
            ghcr.io/klackwerk/svenager/server:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/klackwerk/svenager/frontend:${{ env.VERSION }}
            ghcr.io/klackwerk/svenager/frontend:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Build agent binaries and .deb packages
        uses: goreleaser/goreleaser-action@v6
        with:
          workdir: agent
          args: release --clean
      - name: Extract current changelog section
        run: awk '/^## /{n++} n==1' CHANGELOG.md > release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes || true
          gh release create "$GITHUB_REF_NAME" \
            --title "Svenager ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            agent/dist/*.deb agent/dist/*.tar.gz agent/dist/checksums.txt
