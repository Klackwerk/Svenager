name: agent

on:
  push:
    branches: [main]
    paths: ['agent/**', '.github/workflows/agent.yml']
  pull_request:
    paths: ['agent/**', '.github/workflows/agent.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-compile (amd64, arm64, armv7)
        run: |
          GOOS=linux GOARCH=amd64 go build ./cmd/svenager-agent
          GOOS=linux GOARCH=arm64 go build ./cmd/svenager-agent
          GOOS=linux GOARCH=arm GOARM=7 go build ./cmd/svenager-agent
