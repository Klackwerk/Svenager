---
galaxy_info:
  role_name: kiosk
  author: svenager
  description: >-
    Turns a Raspberry Pi OS Lite / Debian console image into a fullscreen
    web kiosk: cage compositor, the lightweight cog (WPE WebKit) browser
    showing one configurable URL, and a localhost-bound wayvnc for the
    Svenager remote view. Boots into the kiosk session automatically.
  license: AGPL-3.0-or-later
  min_ansible_version: "2.15"
  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
dependencies: []
