name: ansible

on:
  push:
    branches: [main]
    paths: ['ansible/**', '.github/workflows/ansible.yml']
  pull_request:
    paths: ['ansible/**', '.github/workflows/ansible.yml']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ansible-lint
      - run: ansible-lint

  molecule:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'molecule-plugins[docker]' molecule ansible-core
      - run: molecule test
