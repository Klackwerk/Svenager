name: images

# Every push to main refreshes the :latest images (plus a :sha-<short>
# tag); releases keep their version tags via release.yml.
on:
  push:
    branches: [main]
    paths: ['server/**', 'frontend/**', '.github/workflows/images.yml']

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short commit id
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/klackwerk/svenager/server:latest
            ghcr.io/klackwerk/svenager/server:sha-${{ env.SHORT_SHA }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/klackwerk/svenager/frontend:latest
            ghcr.io/klackwerk/svenager/frontend:sha-${{ env.SHORT_SHA }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
