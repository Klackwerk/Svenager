---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Read /etc/motd
      ansible.builtin.slurp:
        src: /etc/motd
      register: motd

    - name: Banner announces the enrollment and the instance URL
      ansible.builtin.assert:
        that:
          - "'enrolled in Svenager' in (motd.content | b64decode)"
          - "'https://svenager.example.org' in (motd.content | b64decode)"
          - "'Molecule test line' in (motd.content | b64decode)"

    - name: Baseline packages are installed
      ansible.builtin.command: git --version # noqa: command-instead-of-module
      changed_when: false
